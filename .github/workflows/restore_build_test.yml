name: Build and test

on:
  push:
  pull_request:

jobs:
  build_test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\WireGuardServerForWindows.sln

      - name: Build release
        run: dotnet build .\WireGuardServerForWindows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\WireGuardServerForWindows.Tests\WireGuardServerForWindows.Tests.csproj --configuration Release --no-build --no-restore

      - name: Upload application build
        uses: actions/upload-artifact@v4
        with:
          name: ws4w-release-binaries
          path: WireGuardServerForWindows\bin\Release\net10.0-windows\
